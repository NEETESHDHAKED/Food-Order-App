{% extends "base.html" %}
{% block title %}Order Done{% endblock %}
{% block content %}
<h1>Order Ho Gaya {{ name }}! 🎉</h1>
<div class="box" style="text-align:center;">
  <p style="font-size:50px;">✅</p>
  <p>Total: <b>₹{{ total }}</b></p>
  {% for item in items %}<span style="display:inline-block; margin:5px; text-align:center;"><img src="{{ item.photo }}" width="70" height="60" style="border-radius:10px; object-fit:cover;"><br>{{ item.name }}</span>{% endfor %}
  <br><br>
  <a href="/history"><button>History Dekho</button></a>
  <a href="/"><button style="background:#fff; color:#FF6D00; border:2px solid #FF6D00;">Home Jao</button></a>
</div>
{% endblock %}
