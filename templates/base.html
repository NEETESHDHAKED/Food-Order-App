<!DOCTYPE html>
<html>
<head>
<title>{% block title %}Best One Food{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 35%, #FFCCBC 75%, #FFF8E1 100%);
    min-height:100vh; margin:0; padding:18px; font-family:'Segoe UI', Arial, sans-serif; color:#333;
  }
  .top-bar{
    background:#fff; padding:12px 16px; border-radius:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08); margin-bottom:18px;
  }
  .top-bar a{ background:#FFF3E0; padding:6px 12px; border-radius:20px; color:#E65100; text-decoration:none; font-weight:700; }
  h1{ text-align:center; color:#E65100; font-size:34px; margin:5px 0 15px; }
  h2{ color:#BF360C; margin:22px 0 10px 5px; }
  .box{ background:#fff; padding:20px; border-radius:18px; max-width:650px; margin:0 auto; box-shadow:0 6px 18px rgba(0,0,0,0.10); }
  .card{ display:inline-block; background:#fff; border-radius:18px; padding:12px; margin:8px; text-align:center; width:165px; vertical-align:top; box-shadow:0 6px 18px rgba(0,0,0,0.10); }
  .card img{ width:140px; height:105px; object-fit:cover; border-radius:12px; }
  .card b{ display:block; margin:8px 0 2px; }
  .price{ color:#2E7D32; font-weight:700; margin-bottom:8px; }
  .card a{ display:inline-block; background:linear-gradient(45deg,#FF6D00,#FF3D00); color:#fff !important; padding:8px 14px; border-radius:20px; text-decoration:none; font-weight:700; }
  button, .btn{ background:linear-gradient(45deg,#FF6D00,#FF3D00); color:#fff; border:none; padding:12px 25px; border-radius:25px; font-weight:700; cursor:pointer; }
  input, select{ padding:11px 14px; border:2px solid #FFE0B2; border-radius:12px; width:100%; margin:6px 0 12px; font-size:15px; outline:none; box-sizing:border-box; }
</style>
</head>
<body>

<div class="top-bar">
  <div>🍔 <b>Best One Food</b></div>
  <div>
    <a href="/">Home</a>
    <a href="/cart">🛒 Cart</a>
    {% if session.get('user') %} <a href="/history">History</a> <a href="/logout">Logout ({{ session.get('user') }})</a>
    {% else %} <a href="/login">Login</a> <a href="/register">Register</a> {% endif %}
    <a href="/admin-login">Admin</a>
  </div>
</div>

{% block content %}{% endblock %}

<p style="text-align:center; color:#999; margin-top:30px; font-size:13px;">Made with ❤️ - Best One Food</p>

</body>
</html>
