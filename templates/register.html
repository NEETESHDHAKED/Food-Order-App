{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register 📝</h1>
<div class="box">
  <form method="POST">
    Username:<br><input name="username" placeholder="mudit" required>
    Password:<br><input type="password" name="password" placeholder="1234" required>
    <button style="width:100%;">Register Karo</button>
  </form>
  <p style="text-align:center; margin-top:12px;">Pehle se account hai? <a href="/login">Login Karo</a></p>
</div>
{% endblock %}
