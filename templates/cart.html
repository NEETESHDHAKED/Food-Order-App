<h1>🛒 Tera Cart</h1>
{% for it in cart_items %}
<div><img src="{{ it.photo }}" width="80" height="60" style="border-radius:8px;"> {{ it.name }} - ₹{{ it.price }} <a href="/remove_from_cart/{{ it.id }}">❌ Remove</a></div><br>
{% endfor %}
<h3>Total: ₹{{ total }}</h3>
<a href="/">+ Aur Add Karo</a> | <a href="/checkout">Checkout Karo ➡️</a>
