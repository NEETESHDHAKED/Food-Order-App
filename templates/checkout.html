{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h1>Checkout ✅</h1>
<div class="box">
  {% for it in cart_items %}<p>🍔 {{ it.name }} - ₹{{ it.price }}</p>{% endfor %}
  <h3>Total: ₹{{ total }}</h3>
  <hr>
  <form method="POST">
    UPI ID:<br><input name="upi" placeholder="mudit@ok" required>
    <button style="width:100%;">Order Place Karo 🎉</button>
  </form>
</div>
{% endblock %}
